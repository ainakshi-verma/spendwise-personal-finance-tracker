# ===================================================================
# SpendWise Test Environment Configuration (H2 in MySQL mode)
# ===================================================================
spring.application.name=spendwise-test
spring.datasource.url=jdbc:h2:mem:finance_tracker_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
