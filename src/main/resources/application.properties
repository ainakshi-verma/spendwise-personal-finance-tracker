# ===================================================================
# SpendWise - Personal Finance Tracker Application Properties
# ===================================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=spendwise-finance-tracker

# MySQL Database Connection (Configurable via Environment Variables or defaults)
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Ainakshi@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Init mode - Hibernate manages schema creation
spring.sql.init.mode=never

# Jackson JSON Configuration
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resources Handling
spring.web.resources.static-locations=classpath:/static/
